<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Jadwal — Skulin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/jadwal.css}"/>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">Skulin</div>
      <div class="brand-sub">Smart Kuliah Utility</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Menu</div>
      <a class="nav-item active" th:href="@{/jadwal}">
        <span class="icon">📅</span> Jadwal
      </a>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">Edit Jadwal</div>
        <div class="topbar-sub">Ubah detail jadwal yang sudah ada</div>
      </div>
      <a th:href="@{/jadwal}" class="btn btn-ghost">
        <i class="fa-solid fa-arrow-left"></i> Kembali
      </a>
    </div>

    <div class="content">
      <div class="card" style="max-width:600px; margin: 0 auto;">
        <div class="card-header">
          <div class="card-title">Detail Jadwal</div>
        </div>
        <form th:action="@{/jadwal/edit/{id}(id=${jadwal.id})}" th:object="${jadwal}" method="post">
          <div class="modal-body">
            <div class="form-grid">
              <div class="form-group full">
                <label>Mata Kuliah</label>
                <input type="text" th:field="*{mataPelajaran}" placeholder="cth. Algoritma & Pemrograman" required/>
              </div>
              <div class="form-group">
                <label>Tipe</label>
                <select th:field="*{tipe}">
                  <option value="kuliah">📚 Kuliah</option>
                  <option value="ujian">📝 Ujian</option>
                  <option value="nongki">☕ Nongki</option>
                </select>
              </div>
              <div class="form-group full">
                  <label>Tanggal</label>
                  <input type="date" th:field="*{tanggal}" required/>
              </div>
              <div class="form-group">
                <label>Jam Mulai</label>
                <input type="time" th:field="*{jamMulai}" required/>
              </div>
              <div class="form-group">
                <label>Jam Selesai</label>
                <input type="time" th:field="*{jamSelesai}" required/>
              </div>
              <div class="form-group full">
                <label>Kelas / Lokasi</label>
                <input type="text" th:field="*{kelas}" placeholder="cth. IF-A / Kafe Coklat"/>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <a th:href="@{/jadwal}" class="btn btn-ghost">Batal</a>
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
